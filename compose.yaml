services:
  artexchange.api:
    image: artexchange.api
    container_name: ArtExchange.API
    build:
      context: .
      dockerfile: src/API/ArtExchange.API/Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    depends_on:
      artexchange.db:
          condition: service_healthy
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=12345678
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/aspnetapp.pfx
    volumes:
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      
        
  artexchange.db:
    image: postgres:latest
    container_name: ArtExchange.DB
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./.containers/db:/var/lib/postgresql
    ports:
      - ${DB_PORT}:${DB_PORT}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]  
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
      
      
      
      
        
  artexchange.adminer:
    image: adminer:latest
    container_name: ArtExchange.Adminer
    depends_on:
      - artexchange.db
    ports:
      - "9000:8080"
    environment:
      - ADMINER_DEFAULT_DRIVER=pgsql
      - ADMINER_DEFAULT_SERVER=artexchange.db

